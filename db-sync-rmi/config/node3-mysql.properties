# ===== Cấu hình node3 (dùng MySQL) =====
node.id=node3
# IP của CHÍNH MÁY chạy node này (sửa lại cho đúng IP LAN của bạn)
node.host=192.168.1.20
node.port=1103

# 2 node còn lại: ip:cổng, cách nhau bởi dấu phẩy
peers=192.168.1.10:1101,192.168.1.10:1102

# Chu kỳ tự đồng bộ bù (giây)
sync.interval=10

# CSDL cục bộ của node này (mỗi node 1 database riêng: db_node1, db_node2, db_node3)
jdbc.url=jdbc:mysql://localhost:3306/db_node3?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
jdbc.user=root
jdbc.password=
